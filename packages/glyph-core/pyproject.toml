[project]
name = "glyph-core"
version = "0.1.0"
description = "Signed, hash-chained spend receipts for AI agents (Glyph Receipts)."
requires-python = ">=3.10"
dependencies = [
    "glyph-protocol>=1.2",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
stripe = ["stripe>=9"]

[project.scripts]
glyph = "glyph_core.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["glyph_core*"]
